        <button onclick="resetData()" class="mt-2 text-red-400 hover:underline">Reiniciar datos de hoy</button>

            },
            jueves: {

                    {

                        sets: 3,

                        reps: "10–15",

                            "Curl con barra EZ (2 x 8–12)",

                        ]
                    },
                    {
                        id: "vie_7",
                        name: "Gemelos en máquina",
                        sets: 3,
                        reps: "10–20",
                        targetRir: "RIR 1–2",
                        alternatives: [
                            "Elevación de talones de pie con mancuernas (3 x 12–20)",
                            "Elevación unilateral con apoyo estable (3 x 12–20 por lado)",
                            "Elevación con barra en rack seguro (3 x 10–20)"
                        ]
                    }
                ]
            }
        };

        let currentDay = 'lunes';
        let workoutState = JSON.parse(localStorage.getItem('alpha_track_state')) || {};

        // Inicializar fecha actual
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'short' });

        function saveState() {
            localStorage.setItem('alpha_track_state', JSON.stringify(workoutState));
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('day-tabs');
            const days = [
                { key: 'lunes', label: 'Lunes' },
                { key: 'martes', label: 'Martes' },
                { key: 'miercoles', label: 'Miércoles' },
                { key: 'jueves', label: 'Jueves' },
                { key: 'viernes', label: 'Viernes' }
            ];

            tabsContainer.innerHTML = days.map(d => `
                <button onclick="switchDay('${d.key}')" class="px-4 py-2 rounded-xl text-sm font-semibold transition-all ${currentDay === d.key ? 'bg-amber-500 text-zinc-950 shadow-lg shadow-amber-500/20' : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'}">
                    ${d.label}
                </button>
            `).join('');
        }

        function switchDay(day) {
            currentDay = day;
            renderTabs();
            renderWorkout();
        }

        function renderWorkout() {
            const dayData = workoutData[currentDay];
            document.getElementById('day-header').innerHTML = `
                <h2 class="text-xl font-bold text-zinc-100">${dayData.title}</h2>
                <p class="text-xs text-zinc-400 mt-1">Registra tus pesos y repeticiones. Si una máquina está ocupada, desliza el selector para usar la alternativa[span_7](start_span)[span_7](end_span).</p>
            `;

            const container = document.getElementById('exercises-container');
            container.innerHTML = dayData.exercises.map((ex, index) => {
                const stateKey = `${currentDay}_${ex.id}`;
                const exState = workoutState[stateKey] || { alternativeIndex: -1, sets: Array(ex.sets).fill({ weight: '', reps: '', rir: '' }) };
                
                // Determinar nombre actual (Principal o Alternativa seleccionada)
                let activeName = ex.name;
                let activeDetails = `${ex.sets} series x ${ex.reps} reps • ${ex.targetRir}`;
                if (exState.alternativeIndex >= 0) {
                    activeName = ex.alternatives[exState.alternativeIndex];
                }

                // Generar HTML de las series
                let setsHtml = '';
                for (let s = 0; s < ex.sets; s++) {
                    const setData = exState.sets[s] || { weight: '', reps: '', rir: '' };
                    setsHtml += `
                        <div class="flex items-center gap-2 bg-zinc-950/60 p-2 rounded-lg border border-zinc-800/80 text-sm">
                            <span class="text-xs font-bold text-amber-500 w-6">S${s+1}</span>
                            <div class="flex-1 flex items-center gap-1">
                                <input type="number" placeholder="Kg" value="${setData.weight}" onchange="updateSet('${ex.id}', ${s}, 'weight', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-center text-zinc-100 focus:outline-none focus:border-amber-500">
                                <span class="text-xs text-zinc-500">kg</span>
                            </div>
                            <div class="flex-1 flex items-center gap-1">
                                <input type="number" placeholder="Reps" value="${setData.reps}" onchange="updateSet('${ex.id}', ${s}, 'reps', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-center text-zinc-100 focus:outline-none focus:border-amber-500">
                                <span class="text-xs text-zinc-500">reps</span>
                            </div>
                            <div class="w-16">
                                <input type="text" placeholder="RIR" value="${setData.rir}" onchange="updateSet('${ex.id}', ${s}, 'rir', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded px-1.5 py-1 text-center text-zinc-300 text-xs focus:outline-none focus:border-amber-500">
                            </div>
                        </div>
                    `;
                }

                // Generar opciones del selector de alternativas
                let altOptionsHtml = `<option value="-1">⭐ Ejercicio Principal (${ex.sets} x ${ex.reps})</option>`;
                ex.alternatives.forEach((alt, altIdx) => {
                    altOptionsHtml += `<option value="${altIdx}" ${exState.alternativeIndex === altIdx ? 'selected' : ''}>🔄 Alternativa: ${alt}</option>`;
                });

                return `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-md transition-all">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <span class="text-[10px] font-bold uppercase tracking-wider text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded-full">Ejercicio ${index + 1}</span>
                                <h3 class="font-bold text-base text-zinc-100 mt-1">${activeName}</h3>
                                <p class="text-xs text-zinc-400">${activeDetails}</p>
                            </div>
                        </div>

                        <!-- Selector de Alternativa (Máquina ocupada / En casa) -->
                        <div class="mb-3">
                            <label class="text-[11px] text-zinc-400 block mb-1 font-medium">Estado del material:</label>
                            <select onchange="changeAlternative('${ex.id}', this.value, ${ex.sets})" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-amber-400 font-medium focus:outline-none focus:border-amber-500">
                                ${altOptionsHtml}
                            </select>
                        </div>

                        <!-- Series Logger -->
                        <div class="space-y-2 mt-3 pt-3 border-t border-zinc-800/60">
                            <div class="flex justify-between text-[11px] font-medium text-zinc-400 px-1">
                                <span>Serie</span>
                                <span>Peso</span>
                                <span>Repeticiones</span>
                                <span>RIR / Notas</span>
                            </div>
                            ${setsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeAlternative(exId, altIndex, totalSets) {
            const stateKey = `${currentDay}_${exId}`;
            if (!workoutState[stateKey]) {
                workoutState[stateKey] = { alternativeIndex: -1, sets: Array(totalSets).fill({ weight: '', reps: '', rir: '' }) };
            }
            workoutState[stateKey].alternativeIndex = parseInt(altIndex);
            saveState();
            renderWorkout();
        }

        function updateSet(exId, setIndex, field, value) {
            const stateKey = `${currentDay}_${exId}`;
            const dayData = workoutData[currentDay];
            const ex = dayData.exercises.find(e => e.id === exId);

            if (!workoutState[stateKey]) {
                workoutState[stateKey] = { alternativeIndex: -1, sets: Array(ex.sets).fill({ weight: '', reps: '', rir: '' }) };
            }
            
            // Asegurar array de series completo
            if (!workoutState[stateKey].sets || workoutState[stateKey].sets.length !== ex.sets) {
                workoutState[stateKey].sets = Array(ex.sets).fill(null).map((_, i) => workoutState[stateKey].sets?.[i] || { weight: '', reps: '', rir: '' });
            }

            workoutState[stateKey].sets[setIndex][field] = value;
            saveState();
        }

        function resetData() {
            if (confirm("¿Seguro que deseas limpiar los registros guardados para este plan?")) {
                localStorage.removeItem('alpha_track_state');
                workoutState = {};
                renderWorkout();
            }
        }

        // Inicializar app
        renderTabs();
        renderWorkout();
    </script>
</body>
</html>
